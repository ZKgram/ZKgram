name: Windows build

# Собирает ZKgram.exe (Windows x64, Qt 6, Release).
#
# Первая сборка долгая: сначала собираются все библиотеки (Qt, FFmpeg, WebRTC
# и т.д.). Готовые библиотеки сохраняются в кэш GitHub после шага "Libraries".
# Если времени одного запуска (6 часов) не хватает, workflow сам запускает
# продолжение (до 6 раз подряд), и сборка идёт дальше с того же места.
#
# Логи каждого запуска (хвосты и строки с ошибками) публикуются в ветку
# ci-logs-<run_id>-<attempt>, чтобы их можно было прочитать через git.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LEGAL'
      - 'changelog.txt'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Номер продолжения (служебное поле)'
        required: false
        default: '0'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      QT_OPTION: "qt6"
      CHAIN: ${{ github.event.inputs.chain || '0' }}
      MAX_CHAIN: "6"
      LIBS_MINUTES: "270"
      BUILD_NEEDS_MINUTES: "200"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Remember start time.
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\logs
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$QT_OPTION" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }' | cut -c1-16)" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: zk-win-thirdparty-${{ env.CACHE_KEY }}-none
          restore-keys: zk-win-thirdparty-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: zk-win-libs-${{ env.CACHE_KEY }}-none
          restore-keys: zk-win-libs-${{ env.CACHE_KEY }}-

      - name: Restore Qt cache.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: zk-win-qt-${{ env.CACHE_KEY }}-none
          restore-keys: zk-win-qt-${{ env.CACHE_KEY }}-

      - name: Libraries.
        id: libraries
        timeout-minutes: 300
        shell: pwsh
        run: |
          $log = Join-Path $env:TBUILD "logs\libraries.log"
          $marker = Join-Path $env:TBUILD "logs\libraries_timeout.txt"
          $script = Join-Path $env:TBUILD "$env:REPO_NAME\Telegram\build\prepare\win.bat"
          $deadline = (Get-Date).AddMinutes([int]$env:LIBS_MINUTES)
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c $script silent $env:QT_OPTION > $log 2>&1" -NoNewWindow -PassThru
          $lastReport = Get-Date
          while (-not $p.HasExited) {
            Start-Sleep -Seconds 20
            if ((Get-Date) -gt $deadline) {
              Write-Host "Time limit for libraries reached, stopping to save progress."
              & taskkill /T /F /PID $p.Id | Out-Null
              Set-Content -Path $marker -Value "timeout"
              exit 0
            }
            if (((Get-Date) - $lastReport).TotalMinutes -ge 5) {
              $lastReport = Get-Date
              Get-Content $log -Tail 3 -ErrorAction SilentlyContinue
            }
          }
          $p.WaitForExit()
          Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true
          echo "THIRDPARTY_STATE=$(find $TBUILD/ThirdParty/cache_keys -type f 2>/dev/null | sort | xargs -r cat | sha256sum | cut -c1-16)" >> $GITHUB_ENV
          echo "QT_STATE=$(find $LibrariesPath/cache_keys -type f -iname 'qt*' 2>/dev/null | sort | xargs -r cat | sha256sum | cut -c1-16)" >> $GITHUB_ENV
          echo "LIBS_ONLY_STATE=$(find $LibrariesPath/cache_keys -type f ! -iname 'qt*' 2>/dev/null | sort | xargs -r cat | sha256sum | cut -c1-16)" >> $GITHUB_ENV
          ls $LibrariesPath/cache_keys 2>/dev/null > "$TBUILD/logs/cache_keys.txt" || true
          ls $TBUILD/ThirdParty/cache_keys 2>/dev/null >> "$TBUILD/logs/cache_keys.txt" || true

      - name: Save ThirdParty cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: zk-win-thirdparty-${{ env.CACHE_KEY }}-${{ env.THIRDPARTY_STATE }}

      - name: Save Libraries cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: zk-win-libs-${{ env.CACHE_KEY }}-${{ env.LIBS_ONLY_STATE }}

      - name: Save Qt cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: zk-win-qt-${{ env.CACHE_KEY }}-${{ env.QT_STATE }}

      - name: Decide whether to build now.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date +%s)
          ELAPSED=$(( (NOW - JOB_START) / 60 ))
          LEFT=$(( 350 - ELAPSED ))
          echo "Elapsed: ${ELAPSED} min, left: ${LEFT} min"
          CONTINUE=0
          if [ -f "$TBUILD/logs/libraries_timeout.txt" ]; then
            echo "Libraries are not finished yet."
            CONTINUE=1
          elif [ "$LEFT" -lt "$BUILD_NEEDS_MINUTES" ]; then
            echo "Libraries are ready, but there is not enough time left to build the app."
            CONTINUE=1
          fi
          if [ "$CONTINUE" = "1" ]; then
            echo "SKIP_BUILD=1" >> $GITHUB_ENV
            if [ "$CHAIN" -lt "$MAX_CHAIN" ]; then
              NEXT=$(( CHAIN + 1 ))
              echo "Starting continuation #$NEXT"
              gh workflow run win.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chain=$NEXT || echo "::warning::Could not start continuation, run the workflow manually."
            else
              echo "::warning::Continuation limit reached, run the workflow manually."
            fi
          fi

      - name: Configure.
        if: env.SKIP_BUILD != '1'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          if "%TG_API_ID%"=="" (
            echo ::warning::TG_API_ID / TG_API_HASH secrets are not set. Building with TEST api credentials, login will be limited.
            set "ZK_API=-D TDESKTOP_API_TEST=ON"
          ) else (
            set "ZK_API=-D TDESKTOP_API_ID=%TG_API_ID% -D TDESKTOP_API_HASH=%TG_API_HASH%"
          )

          call configure.bat ^
          -G "Ninja Multi-Config" ^
          %QT_OPTION% ^
          %ZK_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON > %TBUILD%\logs\configure.log 2>&1
          set CONFIGURE_EXIT=%errorlevel%
          type %TBUILD%\logs\configure.log
          exit /b %CONFIGURE_EXIT%

      - name: Quick check of changed files.
        if: env.SKIP_BUILD != '1'
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          BASE=$(git log --format=%H --grep='Import AyuGram Desktop source code' -n 1)
          echo "Base commit: $BASE"
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'Telegram/SourceFiles' | grep -E '\.cpp$' || true)
          echo "$CHANGED"
          if ! command -v ninja >/dev/null 2>&1; then
            echo "ninja is not in PATH, skipping quick check"
            exit 0
          fi
          ALL=$(ninja -C out -f build-Release.ninja -t targets all | cut -d: -f1)
          TARGETS=""
          for f in $CHANGED; do
            rel="${f#Telegram/}"
            t=$(echo "$ALL" | grep -F "/Release/${rel}.obj" | head -n 1)
            if [ -n "$t" ]; then TARGETS="$TARGETS $t"; fi
          done
          echo "Targets: $TARGETS"
          if [ -z "$TARGETS" ]; then exit 0; fi
          set -o pipefail
          ninja -C out -f build-Release.ninja -k 0 $TARGETS 2>&1 | tee "$TBUILD/logs/quick_check.log"

      - name: ZKgram build.
        if: env.SKIP_BUILD != '1'
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          set -o pipefail
          cmake --build out --config Release --parallel -- -k 0 2>&1 | tee "$TBUILD/logs/build.log"

      - name: Pack artifact.
        if: env.SKIP_BUILD != '1'
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/Release"
          ls -la "$OUT"
          mkdir -p artifact
          cp "$OUT"/*.exe artifact/
          if [ -d "$OUT/modules" ]; then cp -r "$OUT/modules" artifact/; fi
          cp "$TBUILD/$REPO_NAME/LICENSE" artifact/LICENSE.txt
          ls -la artifact

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.SKIP_BUILD != '1'
        with:
          name: ZKgram-win64
          path: artifact\
          retention-days: 30

      - name: Publish release.
        if: env.SKIP_BUILD != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f ZKgram-win64.zip
          (cd artifact && 7z a -tzip ../ZKgram-win64.zip .)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ZKgram-win64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "ZKgram build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Скачай ZKgram-win64.zip, распакуй в любую папку и запусти ZKgram.exe." \
            --latest

      - name: Publish logs.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOGS="$TBUILD/logs"
          OUT="$RUNNER_TEMP/zk-logs"
          rm -rf "$OUT"; mkdir -p "$OUT"
          for f in "$LOGS"/*.log; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .log)
            tail -n 3000 "$f" > "$OUT/$name.tail.txt"
            grep -n -i -E "error|failed|fatal|cannot|unresolved" "$f" | grep -v -i "warning" | tail -n 1500 > "$OUT/$name.errors.txt" || true
          done
          cp "$LOGS"/*.txt "$OUT/" 2>/dev/null || true
          echo "run: ${{ github.run_id }} attempt: ${{ github.run_attempt }} sha: ${{ github.sha }} status: ${{ job.status }}" > "$OUT/README.txt"
          cd "$OUT"
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name="zkgram-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "CI logs for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ci-logs-${{ github.run_id }}-${{ github.run_attempt }}" || echo "Could not push logs"
